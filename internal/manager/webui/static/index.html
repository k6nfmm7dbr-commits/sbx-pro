<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SBX Pro 控制台</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <div class="brand-mark">SBX</div>
    <div class="brand-text">
      <h1>SBX Pro 控制台</h1>
      <p id="status-txt" class="status-txt">连接中…</p>
    </div>
  </div>
  <span id="pulse" class="pulse"></span>
</header>

<main class="main">
  <!-- 首页 -->
  <section id="view-home" class="view on">
    <div class="stats">
      <div class="stat"><label>机器总数</label><strong id="kpi-machines">—</strong></div>
      <div class="stat"><label>在线机器</label><strong id="kpi-online" class="up">—</strong></div>
      <div class="stat"><label>节点总数</label><strong id="kpi-nodes">—</strong></div>
      <div class="stat"><label>累计流量</label><strong id="kpi-total">—</strong></div>
    </div>

    <section class="panel">
      <div class="panel-head"><h2>机器概览</h2><span class="count">共 <b id="kpi-machine-count">0</b> 台</span></div>
      <div id="home-machine-list" class="node-list"></div>
      <div class="empty" id="home-machine-empty" style="display:none">暂无机器，请前往「接入」生成安装命令</div>
    </section>

    <section class="panel">
      <div class="panel-head"><h2>异常节点</h2></div>
      <div id="home-bad-nodes" class="node-list"></div>
      <div class="empty" id="home-bad-empty" style="display:none">无异常节点</div>
    </section>
  </section>

  <!-- 机器 -->
  <section id="view-machines" class="view">
    <section class="panel">
      <div class="panel-head"><h2>机器</h2><span class="count">共 <b id="machines-count">0</b> 台</span></div>
      <div id="machine-list" class="node-list"></div>
      <div class="empty" id="machine-empty" style="display:none">暂无机器，请前往「接入」生成安装命令</div>
    </section>
  </section>

  <!-- 节点 -->
  <section id="view-nodes" class="view">
    <section class="panel">
      <div class="panel-head">
        <h2>节点</h2>
        <button class="btn-primary" id="btn-add-node">＋ 添加节点</button>
      </div>
      <div id="node-list" class="node-list"></div>
      <div class="empty" id="node-empty" style="display:none">暂无节点</div>
    </section>
  </section>

  <!-- 流量 -->
  <section id="view-traffic" class="view">
    <section class="panel">
      <div class="panel-head"><h2>流量汇总</h2></div>
      <div class="stats" style="margin-bottom:14px">
        <div class="stat"><label>累计下载 (tx)</label><strong id="traffic-tx">—</strong></div>
        <div class="stat"><label>累计上传 (rx)</label><strong id="traffic-rx">—</strong></div>
      </div>
      <div id="traffic-list" class="node-list"></div>
      <div class="empty" id="traffic-empty" style="display:none">暂无流量数据</div>
    </section>
  </section>

  <!-- 接入 -->
  <section id="view-join" class="view">
    <section class="panel">
      <div class="panel-head"><h2>接入节点机</h2></div>
      <p class="hint-text">生成一条接入命令，复制到节点机执行即可自动安装并注册（Token 一次性、15 分钟有效）。</p>
      <button class="btn-primary" id="btn-gen-token">生成接入 Token</button>
      <div id="join-result" style="margin-top:14px"></div>
    </section>
  </section>
</main>

<nav class="tabbar">
  <button class="tab on" data-view="home"><span class="ico">⌂</span>首页</button>
  <button class="tab" data-view="machines"><span class="ico">▤</span>机器</button>
  <button class="tab" data-view="nodes"><span class="ico">◎</span>节点</button>
  <button class="tab" data-view="traffic"><span class="ico">↕</span>流量</button>
  <button class="tab" data-view="join"><span class="ico">＋</span>接入</button>
</nav>

<!-- 添加节点弹层 -->
<div id="add-node-modal" class="modal" hidden>
  <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <h3 id="modal-title">添加节点</h3>
    <form id="add-node-form" novalidate>
      <label class="field-label" for="an-machine">服务器</label>
      <select id="an-machine" name="machine_id" required></select>

      <label class="field-label" for="an-name">节点名称</label>
      <input id="an-name" name="name" placeholder="例如：东京-01" required maxlength="64">

      <label class="field-label" for="an-protocol">协议</label>
      <select id="an-protocol" name="protocol"></select>

      <div id="an-dynamic"></div>

      <label class="field-label" for="an-port">端口</label>
      <input id="an-port" name="port" type="number" inputmode="numeric" placeholder="1-65535" required min="1" max="65535">

      <div class="form-error" id="add-node-error" hidden></div>
      <div class="form-actions">
        <button type="button" class="btn-ghost" id="btn-cancel-node">取消</button>
        <button type="submit" class="btn-primary" id="btn-submit-node">创建节点</button>
      </div>
    </form>
  </div>
</div>

<!-- 节点详情/操作弹层 -->
<div id="node-detail-modal" class="modal" hidden>
  <div class="modal-box" role="dialog" aria-modal="true">
    <h3 id="node-detail-title">节点详情</h3>
    <div id="node-detail-body" class="node-detail"></div>
    <div id="share-result" style="margin:10px 0"></div>
    <div class="form-actions">
      <button type="button" class="btn-ghost" id="btn-close-detail">关闭</button>
    </div>
  </div>
</div>

<!-- 确认弹层 -->
<div id="confirm-modal" class="modal" hidden>
  <div class="modal-box modal-box-sm" role="dialog" aria-modal="true">
    <h3 id="confirm-title">确认</h3>
    <p id="confirm-text" class="hint-text"></p>
    <div class="form-actions">
      <button type="button" class="btn-ghost" id="btn-confirm-cancel">取消</button>
      <button type="button" class="btn-danger" id="btn-confirm-ok">确认</button>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>
<script src="app.js"></script>
</body>
</html>
